<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HKEX Filing Downloader</title><style>body{font-family:Arial;background:#f4f6f8;margin:0}main{max-width:800px;margin:50px auto;padding:20px}.card{background:white;padding:28px;border-radius:14px;border:1px solid #ddd}input,select,button{width:100%;padding:12px;margin-top:10px;font-size:16px;box-sizing:border-box}button{background:#172a3b;color:white;border:0;border-radius:8px;font-weight:bold}.hidden{display:none}.box{margin-top:18px;padding:12px;background:#eef3f7;border-radius:8px}.error{background:#fff0f0;color:#922}table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><main><div class="card"><h1>HKEX Filing Downloader</h1><form id="f"><input id="stock" value="0066"><select id="years"><option>5</option><option selected>6</option><option>7</option><option>10</option></select><button id="btn">下載 HKEX Filings</button></form><div id="status" class="box hidden"></div><div id="err" class="box error hidden"></div><section id="result" class="hidden"><h2 id="issuer"></h2><p>找到 <b id="total"></b> 份；成功 <b id="downloaded"></b>；失敗 <b id="failed"></b></p><p><a id="zip" target="_blank">下載全部 ZIP</a></p><table><thead><tr><th>日期</th><th>類型</th><th>公告</th><th>狀態</th><th>PDF</th></tr></thead><tbody id="rows"></tbody></table></section></div></main><script>
const f=document.getElementById('f'),btn=document.getElementById('btn'),status=document.getElementById('status'),err=document.getElementById('err'),result=document.getElementById('result');
const show=x=>x.classList.remove('hidden'),hide=x=>x.classList.add('hidden');
f.addEventListener('submit',async e=>{e.preventDefault();hide(err);hide(result);show(status);status.textContent='正在處理，可能需數分鐘…';btn.disabled=true;try{const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stock:document.getElementById('stock').value.trim(),years:Number(document.getElementById('years').value)})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Download failed');document.getElementById('issuer').textContent=`${d.stock_code} — ${d.company}`;document.getElementById('total').textContent=d.total_documents||0;document.getElementById('downloaded').textContent=d.downloaded||0;document.getElementById('failed').textContent=d.failed||0;document.getElementById('zip').href=d.zip_download_url;const rows=document.getElementById('rows');rows.innerHTML='';(d.documents||[]).forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${x.publication_date||''}</td><td>${x.document_type||''}</td><td>${x.title||''}</td><td>${x.status||''}</td><td>${x.download_url?`<a href="${x.download_url}" target="_blank">PDF</a>`:''}</td>`;rows.appendChild(tr)});hide(status);show(result)}catch(ex){hide(status);show(err);err.textContent=ex.message||String(ex)}finally{btn.disabled=false}});</script></body></html>
